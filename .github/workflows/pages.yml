name: Publicar site no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Detetar fotografias dos álbuns
        run: python3 scripts/build-albums.py
      - name: Preparar ficheiros públicos
        run: |
          mkdir _site
          cp *.html style.css app.js content.js editor.css editor.js albums.json sitemap.xml sitemap.txt robots.txt _site/
          cp -R assets _site/
          touch _site/.nojekyll
      - name: Criar miniaturas e fotografias de visualização
        run: |
          python3 -m pip install 'Pillow==12.2.0'
          python3 scripts/build-photo-previews.py --output _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
